name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # the tests only need the analysis code, so skip the training stack and
      # use the small CPU torch wheel instead of the CUDA one in pyproject
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install safetensors numpy huggingface_hub datasets pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
