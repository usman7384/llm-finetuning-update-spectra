# control_code.yaml on SmolLM2-360M. Budget comes from the SmolLM2 SFT run,
# so run smollm2_sft.yaml first.
seed: 42
phase: control_code

data:
  format: "text"
  dataset: "codeparrot/codeparrot-clean-valid"
  config_name: null
  split: "train"
  text_field: "content"
  target_tokens_from: "checkpoints/smollm2_sft/manifest.json"
  subsample_seed: 42
  val_fraction: 0.02

train:
  model_config: "configs/model_smollm2_360m.yaml"
  learning_rate: 2.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  num_epochs: 3
  weight_decay: 0.0
  max_grad_norm: 1.0
  save_dir: "checkpoints/smollm2_control_code"
  log_dir: "logs/smollm2_control_code"

expected_train_tokens: null
