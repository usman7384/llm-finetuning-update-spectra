# sft.yaml, but on SmolLM2-360M. Same data, same rows, same settings.
seed: 42

data:
  dataset: "yahma/alpaca-cleaned"
  n_examples: 10000
  subsample_seed: 42
  val_fraction: 0.02

train:
  model_config: "configs/model_smollm2_360m.yaml"
  learning_rate: 2.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  num_epochs: 3
  weight_decay: 0.0
  max_grad_norm: 1.0
  save_dir: "checkpoints/smollm2_sft"
  log_dir: "logs/smollm2_sft"

expected_train_tokens: null
