# The eval suite, run the same way on every checkpoint.
# Style: does it follow instructions and refuse sensibly.
# Capability: can it actually reason.

style_metrics:
  - name: "ifeval"
    source: "lm_eval_task"
    task: "ifeval"
  - name: "xstest_refusal_calibration"
    source: "custom"           # scorer is in src/align_geometry/eval/style_metrics.py
    dataset: "natolambert/xstest-v2-copy"
    # refusal rate on safe prompts and on unsafe ones, kept as two separate
    # numbers. averaging them hides whether it's over- or under-refusing.

capability_metrics:
  - name: "gsm8k"
    source: "lm_eval_task"
    task: "gsm8k"
  - name: "arc_challenge"
    source: "lm_eval_task"
    task: "arc_challenge"

generation:
  max_new_tokens: 512
  temperature: 0.0             # greedy, so reruns match
  batch_size: 8
