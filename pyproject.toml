[project]
name = "align-geometry"
version = "0.1.0"
description = "Rank measures of fine-tuning weight updates against a noise baseline: fp32 SFT/DPO/LM fine-tunes with non-alignment controls, released base/instruct pairs, and a check of Timber's effective-rank evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Muhammad Usman Altaf" }]
keywords = ["llm", "fine-tuning", "alignment", "sft", "dpo", "svd", "stable-rank", "effective-rank", "noise-baseline"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "peft>=0.12",
    "trl>=0.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tensorboard>=2.17",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# evals. IFEval needs langdetect and immutabledict but lm-eval doesn't list them
eval = [
    "lm-eval>=0.4.3",
    "langdetect>=1.0.9",
    "immutabledict>=4.3.1",
]
# 8-bit AdamW, needed for full fine-tuning to fit in 6GB
quant = [
    "bitsandbytes>=0.43.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The default Windows torch wheel on PyPI is CPU-only, so pull the CUDA 13.0
# build from PyTorch's index instead. Change the URL to match your own driver
# (https://pytorch.org/get-started/locally/).
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/align_geometry"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# line length is the formatter's job; the only long lines carry `# fmt: skip`
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
